# PR を作ったとき・main が更新されたときに、サイトがビルドできるか自動で確かめます。
name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # ビルドの確認用のダミー値です（本物の接続情報ではありません）。
      # 本物の値は .env.local と Vercel の環境変数にだけ置きます。
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
